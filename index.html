<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="每晚 23:30 的哑铃跟练：计时、组间休息、每组记录，每个动作都有 B 站真人视频和示意动画。">
<meta name="theme-color" content="#15131b">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>睡前哑铃跟练</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* 床头灯：深紫墨色的夜，暖琥珀灯光标出要做的事，月光蓝留给休息。一次只把一个动作放在台上，后面跟着队列。 */
:root{
  --bg:#15131b; --surface:#1f1c27; --surface-2:#2a2634; --line:#353041;
  --ink:#eee8e0; --muted:#a59eb0; --lamp:#f2a65a; --lamp-ink:#22150a;
  --moon:#8ab4c8; --ok:#8cc59a;
  --f-display:"Barlow Condensed","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-body:"Barlow","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f2f7; --surface:#ffffff; --surface-2:#ebe7f0; --line:#e0dbe7;
    --ink:#1f1b27; --muted:#686175; --lamp:#b4601b; --lamp-ink:#ffffff;
    --moon:#3a7390; --ok:#3d8650; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f4f2f7; --surface:#ffffff; --surface-2:#ebe7f0; --line:#e0dbe7;
  --ink:#1f1b27; --muted:#686175; --lamp:#b4601b; --lamp-ink:#ffffff;
  --moon:#3a7390; --ok:#3d8650; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px;display:flex;flex-direction:column;gap:24px}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;font-size:14px;color:var(--lamp)}
h1{font-family:var(--f-display);font-weight:700;font-size:46px;line-height:1.02;margin:2px 0 6px;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;margin:0}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit;min-width:0}
.day .d{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1}
.day .t{font-size:11px;line-height:1.2;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day .mark{height:5px;width:5px;border-radius:50%;background:transparent}
.day.done .mark{background:var(--ok)}
.day.today .d{color:var(--lamp)}
.day[aria-pressed="true"]{border-color:var(--lamp);background:var(--surface-2)}
.day:focus-visible,.btn:focus-visible,.icon-btn:focus-visible,.stepper button:focus-visible,.linkish:focus-visible,.mini:focus-visible,.row.tap:focus-visible,.vlink:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.block h2{font-family:var(--f-display);font-size:15px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;gap:12px}
.list{background:var(--surface);border-radius:14px;overflow:hidden}
.grp{padding:9px 14px 0;font-size:12px;color:var(--moon);border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:11px 14px;border-top:1px solid var(--line);align-items:baseline}
.row.tap{appearance:none;width:100%;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;border-style:solid;border-color:var(--line);border-width:1px 0 0}
.row.tap:hover{background:var(--surface-2)}
.row:first-child,.grp+.row{border-top:0}
.tag{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--lamp)}
.row .n{font-weight:600;line-height:1.35}
.row .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .s.up{color:var(--ok)}
.row .rx{font-family:var(--f-display);font-size:17px;font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--muted);margin-left:6px;font-family:var(--f-body);font-weight:400}
.hintline{font-size:13px;color:var(--muted);margin:-14px 0 0}
.restcard{background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.restcard p{margin:0;color:var(--muted)}
.hrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.hrow:first-child{border-top:0}
.hrow .dt{color:var(--muted);font-variant-numeric:tabular-nums}
.hrow .v{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:14px;color:var(--muted);font-size:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 72%,transparent);z-index:5}
.bar .inner{max-width:560px;margin:0 auto}
.btn{appearance:none;border:0;border-radius:14px;font:inherit;font-weight:600;cursor:pointer;padding:12px 16px;min-height:52px;color:var(--ink);background:var(--surface-2)}
.btn.primary{background:var(--lamp);color:var(--lamp-ink);font-size:18px}
.btn.wide{width:100%}
.icon-btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-size:13px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.mini{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;font:inherit;font-size:13px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.linkish{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px;align-self:center}
/* player */
.ptop{display:flex;align-items:center;gap:10px}
.progress{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden;min-width:0}
.progress i{display:block;height:100%;background:var(--lamp);transition:width .3s}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.confirm{background:var(--surface-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:15px}
.stage{background:var(--surface);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.stage.is-rest{background:color-mix(in srgb,var(--moon) 13%,var(--surface))}
.phase-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.phase{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;font-size:15px;color:var(--lamp)}
.is-rest .phase{color:var(--moon)}
.exname{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1.05;margin:-6px 0 0;text-wrap:balance}
.setline{font-size:15px;color:var(--muted);margin:0}
.setline b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.clock{font-family:var(--f-display);font-weight:600;font-size:104px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 0}
.clock.small{font-size:72px}
.clock-label{text-align:center;font-size:14px;color:var(--muted);margin-top:-6px;min-height:1.5em}
.cue{font-size:15px;margin:0;opacity:.9}
.tip{font-size:14px;margin:0;color:var(--ok)}
.alt{font-size:13px;color:var(--muted);margin:0}
.stepper{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:10px;align-items:center}
.stepper button{height:64px;border-radius:16px;background:var(--surface-2);border:0;color:var(--ink);font-size:32px;font-family:var(--f-display);font-weight:600;cursor:pointer}
.stepper input{height:64px;width:100%;min-width:0;text-align:center;font-family:var(--f-display);font-size:46px;font-weight:600;background:transparent;border:1px solid var(--line);border-radius:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.last{text-align:center;font-size:13px;color:var(--muted);margin:-4px 0 0;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.next{font-size:14px;color:var(--muted);margin:0;padding:0 4px}
.next b{color:var(--ink);font-weight:600}
.breath{width:170px;height:170px;margin:4px auto 0;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--moon) 55%,transparent) 0%,color-mix(in srgb,var(--moon) 18%,transparent) 55%,transparent 72%);transform:scale(.55);transition:transform 6s ease-in-out}
.breath.in{transform:scale(1);transition-duration:4s}
/* 动作示意动画 */
.fig{background:var(--surface);border-radius:16px;padding:10px 12px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.stage .fig{background:var(--bg)}
.fig svg{display:block;width:100%;height:200px}
.stage .fig svg{height:168px}
.fig .ground{stroke:var(--line);stroke-width:2}
.fig .prop{fill:var(--line);stroke:var(--muted);stroke-opacity:.45;stroke-width:1}
.fig .mat{fill:var(--line)}
.fig .matv{fill:var(--surface-2)}
.stage .fig .matv{fill:var(--surface)}
.fig .wall{stroke:var(--muted);stroke-opacity:.6;stroke-width:4}
.fig .barp{stroke:var(--muted);stroke-width:5;stroke-linecap:round}
.fig path.body{fill:none;stroke-linecap:round}
.fig .strap{stroke:var(--lamp);stroke-width:2.5}
.fig .trace{fill:none;stroke:var(--lamp);stroke-width:1.5;stroke-dasharray:2 5;opacity:.55}
.fig line{stroke-linecap:round}
.fig .near{stroke:var(--ink);stroke-width:8}
.fig .far{stroke:var(--muted);stroke-width:8;opacity:.6}
.fig .body{stroke:var(--ink);stroke-width:11}
.fig .foot{stroke-width:6}
.fig .head{fill:var(--ink)}
.fig .db{fill:var(--lamp)}
.fig .far-db{opacity:.75}
.fig-cap{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:4px}
.fig-label{color:var(--lamp);font-weight:600;min-height:1.5em}
.fig-view{color:var(--muted);white-space:nowrap}
/* 示范面板 */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sheet-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 36px);display:flex;flex-direction:column;gap:18px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet .t{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1.05;margin:0 0 4px;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink);font-variant-numeric:tabular-nums}
.sec h3{font-family:var(--f-display);font-size:15px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 8px}
.sec ol,.sec ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.sec p{margin:0}
.sec ul.err li::marker{color:var(--lamp)}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vlink{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;border:1px solid var(--line);min-width:0}
.vlink b{font-weight:600}
.vlink span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
/* 真人视频 */
.vid{display:flex;flex-direction:column;gap:8px}
.vid-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.vid-frame.tall{aspect-ratio:9/16;width:min(100%,calc(70vh * 9 / 16));margin:0 auto}
.vid-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid-cap,.vid-note,.vid-src{margin:0;font-size:13px;color:var(--muted)}
.vid-cap b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.vid-note{color:var(--ink);opacity:.85}
.vid a{color:var(--lamp);text-underline-offset:3px}
.sec-fig h3{margin-bottom:8px}
/* finish */
.done-head{display:flex;flex-direction:column;gap:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:14px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.breath,.progress i{transition:none}}
@media (max-width:380px){.clock{font-size:88px}h1{font-size:40px}.stage .fig svg{height:150px}}
</style>

<body>

<main class="wrap" id="app"></main>
<div class="bar" id="bar" hidden><div class="inner"><button class="btn primary wide" id="startBtn">开始跟练</button></div></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-in" id="sheetIn"></div></div>

<script>
// FIG-START
const FIG=(function(){
  "use strict";
  const L={th:44,sh:44,ft:15,to:52,nk:5,hr:10,ua:30,fa:27};
  const G=190, R=Math.PI/180, DBR=6.5;
  const dn=a=>[Math.sin(a*R),Math.cos(a*R)];        // 从"正下方"量起，正值朝身体前方(+x)
  const upv=t=>[Math.sin(t*R),-Math.cos(t*R)];      // 躯干方向：0 = 直立，正值 = 前倾
  const add=(p,v,s)=>[p[0]+v[0]*s,p[1]+v[1]*s];

  function ik(r,tg,l1,l2,s){
    const dx=tg[0]-r[0],dy=tg[1]-r[1],d0=Math.hypot(dx,dy)||1e-6,ux=dx/d0,uy=dy/d0;
    const d=Math.min(Math.max(d0,Math.abs(l1-l2)+0.01),l1+l2-0.01);
    const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
    return [[r[0]+ux*a-uy*h*s,r[1]+uy*a+ux*h*s],[r[0]+ux*d,r[1]+uy*d]];
  }
  function limb(spec,root,l1,l2,t,P){
    if(spec.a){const m=add(root,dn(spec.a[0]),l1);return [m,add(m,dn(spec.a[1]),l2*(spec.k2==null?1:spec.k2)),spec.a[1]];}
    if(spec.r){const u=spec.r[0]-t,f=spec.r[1]-t,m=add(root,dn(u),l1);return [m,add(m,dn(f),l2),f];}
    let tg=spec.k;
    if(spec.sk) tg=[P.sh[0]+spec.sk[0],P.sh[1]+spec.sk[1]];
    if(spec.hk) tg=[P.hip[0]+spec.hk[0],P.hip[1]+spec.hk[1]];
    const r=ik(root,tg,l1,l2,spec.s==null?1:spec.s);
    return [r[0],r[1],Math.atan2(r[1][0]-r[0][0],r[1][1]-r[0][1])/R];
  }
  function solve(p,v){
    let hip=p.hip,t=p.t||0;
    if(p.ln){const r=lineFrom(p.ln[0],p.ln[1]);hip=r.hip;t=r.t;}
    const u=upv(t),side=[Math.cos(t*R),Math.sin(t*R)],front=v==="front"||v==="top";
    const sh=add(hip,u,L.to*(p.ts||1));
    const hu=upv(t+(p.hd||0)),hy=p.hy==null?1:p.hy,neck=add(sh,hu,L.nk*hy),head=add(neck,hu,L.hr*hy);
    const so=front?16:0,ho=front?9:0,P={hip,sh};
    const shN=add(sh,side,-so),shF=add(sh,side,so),hpN=add(hip,side,-ho),hpF=add(hip,side,ho);
    const aN=limb(p.aN,shN,L.ua,L.fa,t,P),aF=limb(p.aF,shF,L.ua,L.fa,t,P);
    const lN=limb(p.lN,hpN,L.th,L.sh,t,P),lF=limb(p.lF,hpF,L.th,L.sh,t,P);
    const fl=front?6:L.ft;
    const toe=(l,spec)=>add(l[1],dn(spec.f!=null?spec.f:l[2]+90),fl);
    const bend=p.bend||0,ctrl=[(hip[0]+sh[0])/2+side[0]*bend,(hip[1]+sh[1])/2+side[1]*bend];
    return {hip,sh,ctrl,neck,head,shN,shF,hpN,hpF,aN,aF,lN,lF,tN:toe(lN,p.lN),tF:toe(lF,p.lF)};
  }
  function lerp(a,b,x){
    if(typeof a==="number") return typeof b==="number"?a+(b-a)*x:a;
    if(Array.isArray(a)) return a.map((v,i)=>lerp(v,b[i],x));
    if(a&&typeof a==="object"){const o={};for(const k in a)o[k]=(b&&k in b)?lerp(a[k],b[k],x):a[k];return o;}
    return a;
  }
  function cycle(prog){return prog.keys.reduce((s,k)=>s+k.d,0);}
  // keys[i].d = 从上一个关键帧到第 i 个所用秒数；最后一个关键帧回到 keys[0] 用 keys[0].d
  function poseAt(prog,time){
    const ks=prog.keys,n=ks.length,T=cycle(prog);
    let tt=((time%T)+T)%T;
    for(let j=1;j<=n;j++){
      const i=j%n,d=ks[i].d;
      if(tt<=d||j===n){
        const x=d>0?Math.min(1,tt/d):1,e=prog.lin?x:(1-Math.cos(Math.PI*x))/2;
        return {p:lerp(ks[j-1].p,ks[i].p,e),label:ks[i].l||""};
      }
      tt-=d;
    }
  }
  function prims(prog,time){
    const r=poseAt(prog,time),S=solve(r.p,prog.v),db=prog.db||"",out=[],fv=prog.v==="front"||prog.v==="top",FAR=fv?"near":"far";
    const ln=(a,b,c)=>out.push({k:"l",x1:a[0],y1:a[1],x2:b[0],y2:b[1],c});
    const ci=(p,rad,c)=>out.push({k:"c",cx:p[0],cy:p[1],r:rad,c});
    ln(S.hpF,S.lF[0],FAR);ln(S.lF[0],S.lF[1],FAR);ln(S.lF[1],S.tF,FAR+" foot");
    ln(S.shF,S.aF[0],FAR);ln(S.aF[0],S.aF[1],FAR);
    if(db.indexOf("F")>=0) ci(S.aF[1],DBR,fv?"db":"db far-db");
    if(prog.v==="front"||prog.v==="top"){ln(S.hpN,S.hpF,"body");ln(S.shN,S.shF,"body");}
    out.push({k:"q",x1:S.hip[0],y1:S.hip[1],cx:S.ctrl[0],cy:S.ctrl[1],x2:S.sh[0],y2:S.sh[1],c:"body"});
    ln(S.sh,S.neck,"body neck");ci(S.head,L.hr,"head");
    ln(S.hpN,S.lN[0],"near");ln(S.lN[0],S.lN[1],"near");ln(S.lN[1],S.tN,"near foot");
    if(prog.strap) ln(S.aN[1],S.lN[1],"strap");
    ln(S.shN,S.aN[0],"near");ln(S.aN[0],S.aN[1],"near");
    if(db.indexOf("N")>=0) ci(S.aN[1],DBR,"db");
    return {items:out,label:r.label,S};
  }
  function tracePt(prog,S){
    const k=prog.trace;
    return k==="aN"?S.aN[1]:k==="aF"?S.aF[1]:k==="hip"?S.hip:null;
  }
  function frame(prog){
    if(prog._box) return prog._box;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    const grow=(x,y,r)=>{r=r||0;x0=Math.min(x0,x-r);y0=Math.min(y0,y-r);x1=Math.max(x1,x+r);y1=Math.max(y1,y+r);};
    const T=cycle(prog),trace=[];
    for(let i=0;i<64;i++){

  function loop(now){

/* ---------- 步骤 ---------- */
function pushFlow(steps,x,phase){
  if(x.side){
    steps.push({k:"flow",phase,name:x.name,side:"左侧",sec:x.sec,cue:x.cue});
    steps.push({k:"flow",phase,name:x.name,side:"右侧",sec:x.sec,cue:x.cue});
  } else steps.push({k:"flow",phase,name:x.name,sec:x.sec,cue:x.cue,breath:!!x.breath});
}
function buildSteps(w){
  const steps=[];
  w.warm.forEach(x=>pushFlow(steps,x,"热身"));
  if(w.groups.length && w.warm.length) steps.push({k:"rest",sec:20,label:"准备开始",note:"把哑铃和垫子摆好"});
  w.groups.forEach((g,gi)=>{
    const pair=g.items.length>1;
    for(let s=1;s<=g.sets;s++){
      g.items.forEach((id,ii)=>{
        const ex=EX[id];
        const tag=pair?g.tag+(ii+1):g.tag;
        const base={k:"work",ex:id,tag,set:s,sets:g.sets,gi,pair};
        if(ex.type==="time"&&ex.side){
          steps.push(Object.assign({},base,{side:"左侧",sec:ex.sec}));
          steps.push({k:"rest",sec:5,label:"换边"});
          steps.push(Object.assign({},base,{side:"右侧",sec:ex.sec}));
        } else steps.push(Object.assign({},base,{sec:ex.type==="time"?ex.sec:null}));
        const lastItem=ii===g.items.length-1, lastSet=s===g.sets, lastGroup=gi===w.groups.length-1;
        if(lastItem&&lastSet&&lastGroup) return;
        let r, label="组间休息";
        if(pair) r=lastItem?g.restOut:g.restIn; else r=g.rest;
        if(pair&&!lastItem) label="换动作";
        if(lastItem&&lastSet){label="下一个动作";r=pair?g.restOut:Math.max(g.rest,45);}
        steps.push({k:"rest",sec:r,label});
      });
    }
  });
  if(w.groups.length) steps.push({k:"rest",sec:10,label:"准备放松",note:"放下哑铃，躺到垫子上"});
  w.cool.forEach(x=>pushFlow(steps,x,"放松"));
  return steps;
}
function estimate(w){
  let t=0;
  buildSteps(w).forEach(st=>{
    if(st.k==="rest") t+=st.sec;
    else if(st.sec) t+=st.sec+3;
    else t+=EX[st.ex].side?80:45;
  });
  return Math.round(t/60);
}

function mergeProgress(a,b){
  const out={v:1,last:Object.assign({},b.last),sessions:[]};
  Object.keys(a.last).forEach(k=>{const x=a.last[k],y=out.last[k];if(!y||String(x.date)>=String(y.date))out.last[k]=x;});
  const seen={};
  a.sessions.concat(b.sessions).forEach(s=>{if(!seen[s.id]){seen[s.id]=1;out.sessions.push(s);}});
  out.sessions.sort((x,y)=>String(y.id).localeCompare(String(x.id)));
  out.sessions=out.sessions.slice(0,200);
  return out;
}
try{const raw=lsGet("progress");if(raw)progress=normalize(JSON.parse(raw));}catch(e){}

let store={kind:"local"}, syncState="local", saveChain=Promise.resolve();
function setSync(s){syncState=s;const el=$("sync");if(el)el.textContent=syncText();}
function syncText(){
  if(syncState==="ok") return "记录已存到你的账号，换设备打开也在";
  if(syncState==="saving") return "正在保存…";
  if(syncState==="err") return "这次没能存到账号，已先存在这台设备上";
  return "记录保存在这台设备的浏览器里";
}
function persist(){
  lsSet("progress",JSON.stringify(progress));
  if(store.kind!=="db") return;
  const body=JSON.parse(JSON.stringify(progress));
  setSync("saving");
  saveChain=saveChain.then(()=>store.ref.set(body)).then(()=>setSync("ok"),e=>{
    if(e&&e.code==="unavailable"){
      return new Promise(r=>setTimeout(r,700+Math.random()*900)).then(()=>store.ref.set(body)).then(()=>setSync("ok"),()=>setSync("err"));
    }
    setSync("err");
  });
}
async function initStore(){
  const C=window.claude;
  if(!C||typeof C.use!=="function") return;
  try{
    const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
    if(!db||!user) return;
    const uid=await user.id();
    if(!uid) return;
    const ref=db.doc("data/users/"+uid+"/progress");
    const snap=await ref.get();
    store={kind:"db",ref};
    if(snap.exists){
      progress=mergeProgress(normalize(JSON.parse(JSON.stringify(snap.data()))),progress);
      lsSet("progress",JSON.stringify(progress));
      setSync("ok");
    } else if(progress.sessions.length){ persist(); }
    else setSync("ok");
    if(view==="overview") render();
  }catch(e){}
}

function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.resume)ac.resume();}catch(e){}}
function beep(f,d){
  if(!soundOn||!ac) return;
  try{
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.05);
  }catch(e){}
}

function lastVals(id,src){const r=(src||progress.last)[id];return r&&Array.isArray(r.vals)?r.vals:null;}

function start(key){
  initAudio(); lockScreen();
  const w=W[key], td=trainingDate();
  run={key,w,steps:buildSteps(w),i:0,doneSets:0,prev:JSON.parse(JSON.stringify(progress.last)),
       sess:{id:ymd(td)+"-"+Date.now().toString(36),date:ymd(td),key,title:w.title,t0:Date.now(),vals:{}}};
  view="player"; $("bar").hidden=true; window.scrollTo(0,0);
  enterStep(0);
}
function enterStep(i){
  run.i=i; run.paused=false; run.lastTick=null;
  const st=run.steps[i];
  if(st.k==="rest"){run.mode="count";run.end=Date.now()+st.sec*1000;}
  else if(st.sec){run.mode="ready";run.end=Date.now()+3000;}
  else run.mode="idle";
  renderPlayer();
}
function remainingMs(){return run.paused?run.pausedLeft:run.end-Date.now();}
function nextOf(i,pred){for(let j=i;j<run.steps.length;j++){if(pred(run.steps[j]))return run.steps[j];}return null;}
function describe(st){
  if(!st) return "放松，然后睡觉";
  if(st.k==="work"){const ex=EX[st.ex];return ex.name+(st.side?" · "+st.side:"")+" · 第 "+st.set+" 组";}
  return st.name+(st.side?" · "+st.side:"");
}
function renderPlayer(){

  h+='<div class="confirm" id="confirm" hidden><p>结束这次训练？已完成的组会保存。</p><div class="actions"><button class="btn" id="keep">继续练</button><button class="btn primary" id="stop">结束并保存</button></div></div>';
  if(st.k==="rest"){

    h+='<section class="stage is-rest"><div class="phase">'+esc(st.label)+'</div><div class="clock" id="clock">'+fmt(st.sec)+'</div><div class="clock-label">'+(st.note?esc(st.note):"&nbsp;")+'</div>'+

    h+='<div class="actions"><button class="btn" id="plus">+15 秒</button><button class="btn primary" id="skip">跳过休息</button></div></section>';
  } else if(st.k==="flow"){
    const info=FLOWINFO[st.name];
    h+='<section class="stage"><div class="phase-row"><span class="phase">'+st.phase+'</span>'+(info&&(info.yt||info.how)?(VIDEO[st.name]?'<button class="mini" id="demoBtn">看视频</button>':'<button class="mini" id="demoBtn">怎么做</button>'):'')+'</div><h2 class="exname">'+esc(st.name)+'</h2>'+(st.side?'<p class="setline"><b>'+st.side+'</b></p>':'')+
       (st.breath?'<div class="breath" id="breath"></div>':'')+(FLOWFIG[st.name]?'<div class="fig" id="stageFig"></div>':'')+
       '<div class="clock'+(FLOWFIG[st.name]?' small':'')+'" id="clock">'+fmt(st.sec)+'</div><div class="clock-label" id="clockLabel">&nbsp;</div><p class="cue">'+esc(st.cue)+'</p>'+
       '<div class="actions"><button class="btn" id="pp">暂停</button><button class="btn primary" id="skip">下一个</button></div></section>';
  } else {
    const ex=EX[st.ex], prev=lastVals(st.ex,run.prev);
    const setPos=st.side&&ex.type==="time"?(st.set-1)*2+(st.side==="右侧"?1:0):st.set-1;
    h+='<section class="stage"><div class="phase-row"><span class="phase">'+st.tag+(st.pair?" · 交替":"")+'</span><button class="mini" id="demoBtn">看视频示范</button></div><h2 class="exname">'+esc(ex.name)+'</h2>'+
       '<p class="setline">第 <b>'+st.set+'</b> / '+st.sets+' 组'+(st.side?' · <b>'+st.side+'</b>':'')+' · 目标 <b>'+esc(rxText(ex))+'</b></p>';
    h+='<div class="fig" id="stageFig"></div>';
    if(ex.type==="time"){
      h+='<div class="clock small" id="clock">'+fmt(st.sec)+'</div><div class="clock-label" id="clockLabel">&nbsp;</div>';
      if(prev) h+='<p class="last">上次 '+prev.join(" · ")+' 秒</p>';
      h+='<p class="cue">'+esc(ex.cue)+'</p>';
      if(ex.easier) h+='<p class="alt">太难：'+esc(ex.easier)+'</p>';
      h+='<div class="actions"><button class="btn" id="pp">暂停</button><button class="btn primary" id="done">完成</button></div>';
    } else {
      const def=prev&&prev[setPos]!=null?prev[setPos]:ex.lo;
      h+='<p class="cue">'+esc(ex.cue)+'</p>';
      if(canStepUp(st.ex,run.prev)) h+='<p class="tip">上次每组都做到了 '+ex.hi+' 个，今天试试：'+esc(ex.harder)+'</p>';
      h+='<div class="stepper"><button id="minus" aria-label="减一">−</button><input id="reps" type="number" inputmode="numeric" min="0" max="99" value="'+def+'" aria-label="这组做了几个'+(ex.side?"（每侧）":"")+'"><button id="plusRep" aria-label="加一">+</button></div>';
      h+='<p class="last">'+(ex.side?"每侧个数 · ":"做了几个 · ")+(prev?"上次 "+prev.join(" · "):"第一次做，按实际填")+'</p>';
      h+='<button class="btn primary wide" id="done">完成这组</button>';
      const alt=[ex.easier?"太难："+ex.easier:"",ex.harder&&!canStepUp(st.ex,run.prev)?"太轻："+ex.harder:""].filter(Boolean).join("　");
      if(alt) h+='<p class="alt">'+esc(alt)+'</p>';
      h+='<button class="linkish" id="skipSet">跳过这组</button>';
    }
    h+='</section>';
  }
  if(st.k!=="rest"){
    const nx=nextOf(run.i+1,s=>s.k!=="rest");
    h+='<p class="next">接下来：<b>'+esc(describe(nx))+'</b></p>';
  }
  $("app").innerHTML=h;
  if(st.k==="work") FIG.mount($("stageFig"),st.ex);
  else if(st.k==="flow"&&FLOWFIG[st.name]) FIG.mount($("stageFig"),FLOWFIG[st.name]);
  bindPlayer();
  updateClock();
}
function bindPlayer(){
  const on=(id,fn)=>{const el=$(id);if(el)el.addEventListener("click",fn);};
  const st=run.steps[run.i];
  on("snd",()=>{soundOn=!soundOn;lsSet("sound",soundOn?"1":"0");initAudio();$("snd").textContent=soundOn?"声音 开":"声音 关";});
  on("quit",()=>{$("confirm").hidden=false;});
  on("keep",()=>{$("confirm").hidden=true;});
  on("stop",()=>stopRun());
  on("plus",()=>{run.end+=15000;updateClock();});
  on("skip",()=>advance());
  on("skipSet",()=>advance());
  on("done",()=>completeWork());
  on("pp",()=>togglePause());
  on("demoBtn",()=>{if(st.k==="work")openDemo(st.ex);else openFlow(st.name);});
  on("peek",()=>{const nx=nextOf(run.i+1,s=>s.k==="work");if(nx)openDemo(nx.ex);});
  on("minus",()=>{const r=$("reps");r.value=Math.max(0,(parseInt(r.value,10)||0)-1);});
  on("plusRep",()=>{const r=$("reps");r.value=Math.min(99,(parseInt(r.value,10)||0)+1);});
}
function togglePause(){
  if(run.mode==="idle") return;
  if(run.paused){run.paused=false;run.end=Date.now()+run.pausedLeft;}
  else {run.pausedLeft=run.end-Date.now();run.paused=true;}
  const b=$("pp"); if(b) b.textContent=run.paused?"继续":"暂停";
  updateClock();
}
function record(id,val){(run.sess.vals[id]=run.sess.vals[id]||[]).push(val);}
function completeWork(){
  const st=run.steps[run.i]; if(st.k!=="work") return advance();
  const ex=EX[st.ex];
  if(ex.type==="time"){
    if(run.mode==="count"){record(st.ex,Math.max(0,Math.min(st.sec,Math.round(st.sec-remainingMs()/1000))));run.doneSets+=st.side==="左侧"?0:1;}
  } else {
    const v=parseInt($("reps").value,10);
    record(st.ex,isNaN(v)?0:Math.max(0,Math.min(99,v)));
    run.doneSets++;
  }
  const nw=nextOf(run.i+1,s=>s.k==="work");
  if(!nw||nw.gi!==st.gi) commitSession(false);
  advance();
}
function advance(){
  if(run.i+1>=run.steps.length) return finish();
  enterStep(run.i+1);
}
function commitSession(final){
  const s=run.sess;
  Object.keys(s.vals).forEach(id=>{if(s.vals[id].length)progress.last[id]={date:s.date,vals:s.vals[id].slice()};});
  const entry={id:s.id,date:s.date,key:s.key,title:s.title,sets:run.doneSets,min:Math.max(1,Math.round((Date.now()-s.t0)/60000)),done:!!final};
  const idx=progress.sessions.findIndex(x=>x.id===s.id);
  if(idx>=0) progress.sessions[idx]=entry; else progress.sessions.unshift(entry);
  progress.sessions=progress.sessions.slice(0,200);
  persist();
}
function stopRun(){
  const hasWork=run.doneSets>0||progress.sessions.some(x=>x.id===run.sess.id);
  if(hasWork) commitSession(false);
  unlockScreen(); run=null; view="overview"; render(); window.scrollTo(0,0);
}
function finish(){
  if(!$("sheet").hidden) closeSheet();
  commitSession(true); unlockScreen(); view="finish"; render(); window.scrollTo(0,0);
}
function renderFinish(){
  const s=run.sess;
  let h='<header class="done-head"><div class="eyebrow">'+esc(s.title)+' · 完成</div><h1>练完了</h1><p class="meta">现在把手机放下，早点睡。</p></header>';
  h+='<div class="stats"><div class="stat"><div class="k">完成组数</div><div class="v">'+run.doneSets+'</div></div><div class="stat"><div class="k">用时</div><div class="v">'+Math.max(1,Math.round((Date.now()-s.t0)/60000))+' 分钟</div></div></div>';
  const ids=Object.keys(s.vals);
  if(ids.length){
    h+='<section class="block"><h2><span>这次的数字</span><span>对比上次</span></h2><div class="list">';
    ids.forEach(id=>{
      const ex=EX[id], prev=lastVals(id,run.prev), cur=s.vals[id];
      const sum=a=>a.reduce((x,y)=>x+y,0);
      let cmp="第一次";
      if(prev){const d=sum(cur)-sum(prev);cmp=d>0?"多 "+d+" "+unit(ex):d<0?"少 "+(-d)+" "+unit(ex):"持平";}
      h+='<div class="row"><span class="tag"></span><div><div class="n">'+esc(ex.name)+'</div><div class="s'+(cmp.indexOf("多")===0?" up":"")+'">'+cmp+'</div></div><span class="rx">'+cur.join(" · ")+'</span></div>';
    });
    h+='</div></section>';
  }
  h+='<p class="foot" id="sync">'+syncText()+'</p><button class="btn wide" id="back">回到计划</button>';
  $("app").innerHTML=h;
  $("back").addEventListener("click",()=>{run=null;view="overview";render();window.scrollTo(0,0);});
}
function updateClock(){
  if(!run||view!=="player") return;
  const st=run.steps[run.i], el=$("clock"), lab=$("clockLabel");
  if(!el) return;
  if(run.mode==="ready"){el.textContent=fmt(remainingMs()/1000);if(lab)lab.textContent="预备";}
  else if(run.mode==="count"){
    el.textContent=fmt(remainingMs()/1000);
    if(lab){
      if(run.paused) lab.textContent="已暂停";
      else if(st.breath){const e=(st.sec*1000-remainingMs())/1000%10;lab.textContent=e<4?"吸气":"呼气";}
      else if(st.k!=="rest") lab.textContent=st.k==="flow"?"保持":"坚持住";
    }
  }
  const b=$("breath");
  if(b){
    const go=run.mode==="count"&&!run.paused;
    const e=(st.sec*1000-remainingMs())/1000%10;
    b.classList.toggle("in",go&&e<4);
  }
}
function tick(){
  if(!run||view!=="player"||run.paused||run.mode==="idle") return;
  const st=run.steps[run.i], left=remainingMs();
  if(run.mode==="ready"){
    if(left<=0){run.mode="count";run.end=Date.now()+st.sec*1000;beep(660,0.14);}
    updateClock(); return;
  }
  const s=Math.ceil(left/1000);
  if(s<=3&&s>0&&run.lastTick!==s&&!st.breath){run.lastTick=s;beep(440,0.08);}
  if(left<=0){
    beep(880,0.3); buzz();
    if(st.k==="work"){completeWork();} else advance();
    return;
  }
  updateClock();
}
setInterval(tick,200);

$("startBtn").addEventListener("click",()=>{const k=PLAN[selected];if(k)start(k);});
render();
initStore();
})();
</script>
